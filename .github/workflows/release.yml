name: Release

# Release by pushing a plain version tag (no releaseLabel suffix):
#   git tag v2.2.0
#   git push origin v2.2.0
# Or trigger this workflow manually and provide the tag below.
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v2.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Resolve and verify version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package version $PKG_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build
        run: |
          COR3_VERSION_NAME="$PKG_VERSION" npm run build

      - name: Verify manifest identity
        run: |
          node -e "const m=require('./dist/manifest.json');if(m.version_name!==process.env.PKG_VERSION){console.error('version_name',m.version_name,'!=',process.env.PKG_VERSION);process.exit(1)}if(m.name!=='COR3 Helper 2.0'){console.error('unexpected manifest name',m.name);process.exit(1)}"

      - name: Package
        run: |
          ZIP="COR3 Helper ${TAG}.zip"
          (cd dist && zip -r -X "../${ZIP}" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "COR3 Helper ${{ env.TAG }}"
          files: |
            COR3 Helper ${{ env.TAG }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
